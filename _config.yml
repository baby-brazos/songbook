title: Little Songbook
short_title: Songbook     # name under the home-screen icon
description: Our family songbook
lang: en
markdown: kramdown

# Each song is a file in the _songs folder and gets its own page.
collections:
  songs:
    output: true
    permalink: /songs/:name/

defaults:
  - scope:
      path: ""
      type: songs
    values:
      layout: song

exclude:
  - README.md
