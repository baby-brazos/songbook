<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <g fill="#9a7b5f" fill-opacity="0.16" stroke="#9a7b5f" stroke-opacity="0.16">
    <!-- eighth note -->
    <g transform="translate(40 40) rotate(-12)">
      <ellipse cx="8" cy="34" rx="8" ry="6" transform="rotate(-20 8 34)" stroke="none"/>
      <rect x="14" y="0" width="2.6" height="34" stroke="none"/>
      <path d="M16 0 C24 6 28 12 24 22 C26 14 22 9 16 7 Z" stroke="none"/>
    </g>
    <!-- beamed notes -->
    <g transform="translate(150 120) rotate(8)">
      <ellipse cx="8" cy="34" rx="8" ry="6" transform="rotate(-20 8 34)" stroke="none"/>
      <ellipse cx="38" cy="30" rx="8" ry="6" transform="rotate(-20 38 30)" stroke="none"/>
      <rect x="14" y="2" width="2.6" height="32" stroke="none"/>
      <rect x="44" y="-2" width="2.6" height="32" stroke="none"/>
      <polygon points="14,2 46.6,-2 46.6,4 14,8" stroke="none"/>
    </g>
    <!-- quarter note -->
    <g transform="translate(70 160) rotate(10)">
      <ellipse cx="7" cy="28" rx="7" ry="5.2" transform="rotate(-20 7 28)" stroke="none"/>
      <rect x="12.4" y="0" width="2.4" height="28" stroke="none"/>
    </g>
    <!-- staff fragment -->
    <g fill="none" stroke-width="1.2">
      <path d="M150 30 h70 M150 38 h70 M150 46 h70 M150 54 h70 M150 62 h70"/>
    </g>
    <ellipse cx="172" cy="50" rx="5" ry="3.8" transform="rotate(-20 172 50)" stroke="none"/>
    <ellipse cx="196" cy="42" rx="5" ry="3.8" transform="rotate(-20 196 42)" stroke="none"/>
  </g>
  <g fill="#9a7b5f" fill-opacity="0.18">
    <circle cx="120" cy="20" r="2"/><circle cx="20" cy="120" r="1.6"/><circle cx="220" cy="220" r="1.8"/><circle cx="130" cy="210" r="1.4"/>
  </g>
</svg>
