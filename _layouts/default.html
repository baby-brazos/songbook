<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f0e3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1916" media="(prefers-color-scheme: dark)">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="apple-mobile-web-app-title" content="{{ site.short_title | default: site.title }}">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" type="image/png" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <main class="screen">
{{ content }}
  </main>
  <script src="{{ '/assets/song.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
